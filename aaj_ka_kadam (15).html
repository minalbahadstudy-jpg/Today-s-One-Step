<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Today's One Step</title>
<style>
  :root{
    --bg: #FAF6EC;
    --card: #FFFFFF;
    --ink: #1A1F1C;
    --sage: #22C55E;
    --sage-dark: #16A34A;
    --amber: #FF9F1C;
    --line: #E3DCCB;
    --done: #A9BBA6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
    padding: 32px 20px 60px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom: 28px;
  }
  header .eyebrow{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12.5px;
    color: var(--sage-dark);
    margin-bottom: 6px;
  }
  header h1{
    font-size: 34px;
    font-weight: 500;
    margin: 0 0 8px;
    color: var(--ink);
  }
  header p{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    color: #6b6558;
    margin: 0;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .dump{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 26px;
  }
  .dump label{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    color: var(--sage-dark);
    display:block;
    margin-bottom: 8px;
  }
  .dump textarea{
    width:100%;
    min-height: 54px;
    resize: vertical;
    border: none;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    color: var(--ink);
    outline:none;
    line-height:1.5;
  }
  .dump .row{display:flex;justify-content:flex-end;align-items:center;gap:10px;}
  .dump .status{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    color: #9a9484;
  }
  .dump button{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    background: var(--sage);
    color: white;
    border:none;
    padding: 7px 14px;
    border-radius: 20px;
    cursor:pointer;
  }
  .dump button:hover{background:var(--sage-dark);}

  .capacity{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 26px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .capacity h3{
    font-size: 15px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color: var(--sage-dark);
    margin: 0 0 12px;
  }
  .capacity .row2{
    display:flex;
    gap: 14px;
    flex-wrap:wrap;
    margin-bottom: 12px;
    align-items:center;
  }
  .capacity label{
    font-size: 13.5px;
    color: #6b6558;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .capacity input[type=time]{
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 15px;
    font-family: inherit;
  }
  .routineRow{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    align-items:center;
    flex-wrap: wrap;
  }
  .routineRow input[type=text]{
    flex:1;
    min-width: 140px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 15px;
    font-family: inherit;
  }
  .routineRow input[type=number]{
    width: 70px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 15px;
    font-family: inherit;
  }
  .routineRow input[type=time]{
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--sage-dark);
  }
  .routineRow button{
    border:none;
    background:transparent;
    color:#b08a6a;
    cursor:pointer;
    font-size: 18px;
    line-height:1;
  }
  .capacity .actions{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 10px;
    flex-wrap:wrap;
    gap:10px;
  }
  .addRowBtn{
    font-size: 13.5px;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--sage-dark);
    padding: 5px 12px;
    border-radius: 20px;
    cursor:pointer;
  }
  .calcBtn{
    font-size: 15px;
    background: var(--amber);
    color:white;
    border:none;
    padding: 8px 16px;
    border-radius: 20px;
    cursor:pointer;
  }
  .leftoverResult{
    margin-top: 12px;
    padding: 10px 12px;
    background: #FAF8F3;
    border-radius: 10px;
    font-size: 15px;
    color: var(--ink);
    line-height:1.6;
  }
  .leftoverResult b{color:var(--sage-dark);}

  .scheduleSplit{
    display: flex;
    gap: 14px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .scheduleCol{
    flex: 1;
    min-width: 220px;
    background: #FAF8F3;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .scheduleCol h4{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--sage-dark);
    margin: 0 0 8px;
  }
  .scheduleBlock{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line);
  }
  .scheduleBlock:last-child{ border-bottom: none; }
  .scheduleBlock .label{ color: var(--ink); }
  .scheduleBlock .time{ color: var(--sage-dark); font-weight: 600; white-space: nowrap; }
  .scheduleBlock.free .label{ color: #a89f8c; font-style: italic; }
  .scheduleBlock.free .time{ color: #a89f8c; font-weight: 400; }

  .progressPanel{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 26px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .progressPanel h3{
    font-size: 15px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color: var(--sage-dark);
    margin: 0 0 10px;
  }
  .progressBar{
    display:flex;
    height: 14px;
    border-radius: 7px;
    overflow:hidden;
    background: #EFEBE0;
    margin-bottom: 8px;
  }
  .progressBar .seg{
    height:100%;
  }
  .progressLegend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size: 13px;
    color: #6b6558;
  }
  .progressLegend .dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:5px;
  }

  .reorder{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-left:auto;
  }
  .reorder button{
    border:none;
    background:transparent;
    color:#9a9484;
    cursor:pointer;
    font-size: 11.5px;
    line-height:1;
    padding:1px 4px;
  }
  .reorder button:hover{color:var(--sage-dark);}

  .quota{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    color: var(--amber);
    font-weight:600;
  }
  .locBadge{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
  }
  .locBadge.home{
    background: #EAF1E7;
    color: var(--sage-dark);
  }
  .locBadge.office{
    background: #FBF1E2;
    color: var(--amber);
  }
  .card.parked{
    opacity: 0.45;
  }
  .card.parked .parkedNote{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    color: #a89f8c;
    margin-top: 8px;
  }
  .goalsBox{
    margin-bottom: 10px;
  }
  .goalItem{
    margin-bottom: 6px;
    padding: 4px 0 5px 8px;
    border-bottom: 1px dashed var(--line);
    border-left: 3px solid #D3D1C7;
  }
  .goalItem.status-completed{ border-left-color: #639922; }
  .goalItem.status-postponed{ border-left-color: #EF9F27; }
  .goalItem.status-cancelled{ border-left-color: #E24B4A; }
  .goalRow{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom: 4px;
  }
  .goalRow input[type=text]{
    flex:1;
    border:none;
    border-bottom: 1px dashed var(--line);
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: #4a453b;
    padding: 2px 0 4px;
    outline:none;
  }
  .goalRow input[type=text]:focus{border-color: var(--amber);}
  .goalRow select{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 11.5px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 2px 4px;
    color: #6b6558;
    background: #FAF8F3;
  }
  .goalRow select.urgent-select{
    border-color: #E24B4A;
    color: #B4231F;
    background: #FDECEC;
    font-weight: 600;
  }
  .urgentBadge{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: #ffffff;
    background: #E24B4A;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .goalItem.category-urgent{
    background: #FFF3F3;
    border-radius: 8px;
    padding: 6px 8px 5px 10px;
  }
  .goalRow .rm{
    border:none;
    background:transparent;
    color:#c7a58a;
    cursor:pointer;
    font-size: 15px;
  }
  .scheduleRow{
    display:flex;
    align-items:center;
    gap:5px;
    padding-left: 2px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .scheduleRow span{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    color: #a89f8c;
  }
  .scheduleRow input[type=date],
  .scheduleRow input[type=time]{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 11.5px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 4px;
    background: #FAF8F3;
    color: #6b6558;
  }
  .dailyToggle{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    border: 1px solid var(--line);
    background: #FAF8F3;
    color: #6b6558;
    padding: 2px 8px;
    border-radius: 10px;
    cursor:pointer;
  }
  .dailyToggle.active{
    background: #E6F1FB;
    border-color: #378ADD;
    color: #185FA5;
    font-weight: 600;
  }
  .statusRow{
    display:flex;
    align-items:center;
    gap:5px;
    padding-left: 2px;
    flex-wrap: wrap;
  }
  .statusBtn{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    border: 1px solid var(--line);
    background: #FAF8F3;
    color: #6b6558;
    padding: 2px 8px;
    border-radius: 10px;
    cursor:pointer;
  }
  .statusBtn.active-completed{ background:#EAF3DE; border-color:#639922; color:#3B6D11; }
  .statusBtn.active-postponed{ background:#FAEEDA; border-color:#EF9F27; color:#854F0B; }
  .statusBtn.active-cancelled{ background:#FCEBEB; border-color:#E24B4A; color:#A32D2D; }
  .addGoalBtn{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--sage-dark);
    padding: 3px 10px;
    border-radius: 12px;
    cursor:pointer;
    margin-bottom: 8px;
  }
  .focusRow{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom: 6px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    color: var(--sage-dark);
  }
  .focusRow select{
    flex:1;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 6px;
    background: #FAF8F3;
    color: var(--ink);
  }
  .suggestBtn.loading{opacity:0.6; pointer-events:none;}

  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (max-width:600px){
    .grid{grid-template-columns: 1fr;}
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 14px;
    transition: opacity 0.4s ease, transform 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .card.done{
    opacity: 0.55;
  }
  .card .top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    flex-wrap: wrap;
  }
  .card svg{flex-shrink:0;}
  .card .name{
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }
  .card .stepwrap{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    color: var(--sage-dark);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .suggestBtn{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    text-transform:none;
    letter-spacing:0;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--amber);
    padding: 2px 9px;
    border-radius: 12px;
    cursor:pointer;
  }
  .suggestBtn:hover{background:#FBF3E6;}
  .card textarea.step{
    width:100%;
    border:none;
    background: #FAF8F3;
    border-radius: 8px;
    padding: 8px 10px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15.5px;
    color: var(--ink);
    resize:none;
    min-height: 42px;
    outline: none;
    line-height:1.45;
  }
  .card.done textarea.step{
    text-decoration: line-through;
    color: #8b9a8b;
  }
  .card .bottom{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 10px;
  }
  .doneBtn{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    border: 1px solid var(--sage);
    background: transparent;
    color: var(--sage-dark);
    padding: 5px 12px;
    border-radius: 20px;
    cursor:pointer;
  }
  .doneBtn.active{
    background: var(--sage);
    color:white;
    border-color: var(--sage);
  }
  .streak{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    color: #a89f8c;
  }

  footer{
    text-align:center;
    margin-top: 30px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    color: #9a9484;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">One Day, One Step</div>
    <h1>Today's One Step</h1>
    <p>You don't have to finish everything. Just today's one step. Everything else stays parked here — not in your head.</p>
  </header>

  <div id="storageWarning" style="display:none;background:#FCEBEB;border:1px solid #F09595;color:#791F1F;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;padding:10px 14px;border-radius:10px;margin-bottom:16px;line-height:1.5;"></div>

  <div style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:16px;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;flex-wrap:wrap;">
    <button id="reminderBtn" onclick="enableReminders()" style="font-size:13.5px;background:transparent;border:1px solid var(--line);color:var(--sage-dark);padding:6px 14px;border-radius:20px;cursor:pointer;">🔔 Enable reminders</button>
    <button onclick="exportData()" style="font-size:13.5px;background:transparent;border:1px solid var(--line);color:var(--sage-dark);padding:6px 14px;border-radius:20px;cursor:pointer;">📤 Export backup</button>
    <label style="font-size:13.5px;background:transparent;border:1px solid var(--line);color:var(--sage-dark);padding:6px 14px;border-radius:20px;cursor:pointer;">
      📥 Import backup
      <input type="file" accept="application/json" onchange="importData(this.files[0])" style="display:none;">
    </label>
  </div>

  <div class="dump">
    <label>Late-night wandering thoughts — park them here</label>
    <textarea id="brainDump" placeholder="Whatever's spinning in your mind, write it here... it'll be waiting tomorrow morning."></textarea>
    <div class="row">
      <span class="status" id="dumpStatus"></span>
      <button onclick="saveDump()">Park it</button>
    </div>
  </div>

  <div class="capacity">
    <h3>Today's Time — How Much Is Left?</h3>
    <div class="row2">
      <label>Wake up
        <input type="time" id="wakeTime">
      </label>
      <label>Sleep time
        <input type="time" id="sleepTime">
      </label>
      <label>Duty starts
        <input type="time" id="dutyStart">
      </label>
      <label>Duty ends
        <input type="time" id="dutyEnd">
      </label>
      <label>Kaushik's wake up
        <input type="time" id="kaushikWake" onchange="updateKaushikSchedule()">
      </label>
    </div>
    <div id="kaushikScheduleNote" style="display:none;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;color:#F5A623;font-weight:600;margin-bottom:10px;"></div>
    <div id="routineList"></div>
    <div class="actions">
      <button class="addRowBtn" onclick="addRoutineRow()">+ Add mandatory task</button>
      <button class="addRowBtn" onclick="saveAsDefaultRoutine()">Save as my daily default</button>
      <button class="calcBtn" onclick="calculateCapacity()">Calculate leftover time</button>
    </div>
    <div class="leftoverResult" id="leftoverResult" style="display:none;"></div>
    <div class="scheduleSplit" id="scheduleSplit" style="display:none;">
      <div class="scheduleCol">
        <h4>🌅 Morning</h4>
        <div id="morningSchedule"></div>
      </div>
      <div class="scheduleCol">
        <h4>🌆 Evening</h4>
        <div id="eveningSchedule"></div>
      </div>
    </div>
    <span class="status" id="defaultStatus" style="font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;color:#9a9484;"></span>
  </div>

  <div class="progressPanel">
    <h3>Today's Progress</h3>
    <div class="progressBar" id="progressBar"></div>
    <div class="progressLegend" id="progressLegend"></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    Whatever didn't happen today isn't a failure — it's just tomorrow's step.
  </footer>
</div>

<script>
const storage = {
  async get(key, shared){
    shared = !!shared;
    if (typeof window.storage !== 'undefined' && window.storage && window.storage.get){
      try{ return await window.storage.get(key, shared); }catch(e){ return null; }
    }
    try{
      const raw = localStorage.getItem((shared ? 'shared:' : '') + key);
      return raw === null ? null : { key, value: raw, shared };
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    shared = !!shared;
    if (typeof window.storage !== 'undefined' && window.storage && window.storage.set){
      try{ return await window.storage.set(key, value, shared); }catch(e){ return null; }
    }
    try{
      localStorage.setItem((shared ? 'shared:' : '') + key, value);
      return { key, value, shared };
    }catch(e){ return null; }
  },
  async delete(key, shared){
    shared = !!shared;
    if (typeof window.storage !== 'undefined' && window.storage && window.storage.delete){
      try{ return await window.storage.delete(key, shared); }catch(e){ return null; }
    }
    try{
      localStorage.removeItem((shared ? 'shared:' : '') + key);
      return { key, deleted: true, shared };
    }catch(e){ return null; }
  }
};

let state = {};
let priorityOrder = PROJECTS.map(p => p.id);
let routineTasks = [];

const CHUNK = 25; // minutes given per project per priority pass

const GOAL_CATEGORIES = {
  current: 'Ongoing',
  future: 'Big Future Goal',
  urgent: 'Urgent'
};

function addGoal(id){
  const s = state[id];
  s.goals.push({ text: '', category: 'current', date: '', startTime: '', endTime: '', status: 'pending' });
  if (s.focusIdx === null) s.focusIdx = s.goals.length - 1;
  saveProject(id);
  render();
}

function removeGoal(id, idx){
  const s = state[id];
  s.goals.splice(idx, 1);
  if (s.focusIdx === idx) s.focusIdx = s.goals.length ? 0 : null;
  else if (s.focusIdx > idx) s.focusIdx -= 1;
  saveProject(id);
  render();
}

function updateGoalText(id, idx, val){
  state[id].goals[idx].text = val;
  saveProject(id);
}

function updateGoalCategory(id, idx, val){
  state[id].goals[idx].category = val;
  saveProject(id);
  render();
}

function updateGoalDate(id, idx, val){
  state[id].goals[idx].date = val;
  saveProject(id);
}

function updateGoalStart(id, idx, val){
  state[id].goals[idx].startTime = val;
  saveProject(id);
}

function updateGoalEnd(id, idx, val){
  state[id].goals[idx].endTime = val;
  saveProject(id);
}

function setFocus(id, val){
  state[id].focusIdx = val === '' ? null : Number(val);
  saveProject(id);
}

function setGoalStatus(id, idx, status){
  const g = state[id].goals[idx];
  if (g.isDaily){
    const t = todayStr();
    if (!g.statusByDate) g.statusByDate = {};
    g.statusByDate[t] = (g.statusByDate[t] === status) ? 'pending' : status;
  } else {
    g.status = (g.status === status) ? 'pending' : status;
  }
  saveProject(id);
  render();
}

function toggleDaily(id, idx){
  const g = state[id].goals[idx];
  g.isDaily = !g.isDaily;
  if (g.isDaily && !g.statusByDate) g.statusByDate = {};
  saveProject(id);
  render();
}

function renderGoalsForProject(id){
  const s = state[id];
  const box = document.getElementById('goalsBox-' + id);
  if (!box) return;
  box.innerHTML = '';
  const t = todayStr();
  s.goals.forEach((g, idx) => {
    if (g.date === undefined) g.date = '';
    if (g.startTime === undefined) g.startTime = '';
    if (g.endTime === undefined) g.endTime = '';
    if (g.status === undefined) g.status = 'pending';
    if (g.isDaily === undefined) g.isDaily = false;
    if (g.statusByDate === undefined) g.statusByDate = {};
    const effectiveStatus = g.isDaily ? (g.statusByDate[t] || 'pending') : g.status;
    const isUrgent = g.category === 'urgent';
    const item = document.createElement('div');
    item.className = 'goalItem' + (effectiveStatus !== 'pending' ? ' status-' + effectiveStatus : '') + (isUrgent ? ' category-urgent' : '');
    item.innerHTML = `
      <div class="goalRow">
        ${isUrgent ? '<span class="urgentBadge">🔴 URGENT</span>' : ''}
        <input type="text" placeholder="write the goal..." value="${g.text}">
        <select class="${isUrgent ? 'urgent-select' : ''}">
          <option value="current" ${g.category === 'current' ? 'selected' : ''}>Ongoing</option>
          <option value="urgent" ${g.category === 'urgent' ? 'selected' : ''}>Urgent</option>
          <option value="future" ${g.category === 'future' ? 'selected' : ''}>Future Goal</option>
        </select>
        <button class="rm" onclick="removeGoal('${id}', ${idx})">✕</button>
      </div>
      <div class="scheduleRow">
        <button class="dailyToggle ${g.isDaily ? 'active' : ''}" onclick="toggleDaily('${id}', ${idx})">🔁 Daily</button>
        ${g.isDaily ? '' : `<span>Date:</span><input type="date" value="${g.date}">`}
        <input type="time" value="${g.startTime}">
        <span>-</span>
        <input type="time" value="${g.endTime}">
      </div>
      <div class="statusRow">
        <button class="statusBtn ${effectiveStatus === 'completed' ? 'active-completed' : ''}" onclick="setGoalStatus('${id}', ${idx}, 'completed')">✓ Done</button>
        <button class="statusBtn ${effectiveStatus === 'postponed' ? 'active-postponed' : ''}" onclick="setGoalStatus('${id}', ${idx}, 'postponed')">⏸ Postponed</button>
        <button class="statusBtn ${effectiveStatus === 'cancelled' ? 'active-cancelled' : ''}" onclick="setGoalStatus('${id}', ${idx}, 'cancelled')">✕ Cancelled</button>
      </div>
    `;
    item.querySelector('.goalRow input[type=text]').addEventListener('input', e => updateGoalText(id, idx, e.target.value));
    item.querySelector('.goalRow select').addEventListener('change', e => updateGoalCategory(id, idx, e.target.value));
    if (!g.isDaily){
      const dateInput = item.querySelector('.scheduleRow input[type=date]');
      if (dateInput) dateInput.addEventListener('input', e => updateGoalDate(id, idx, e.target.value));
    }
    const timeInputs = item.querySelectorAll('.scheduleRow input[type=time]');
    timeInputs[0].addEventListener('input', e => updateGoalStart(id, idx, e.target.value));
    timeInputs[1].addEventListener('input', e => updateGoalEnd(id, idx, e.target.value));
    box.appendChild(item);
  });

  const focusSelect = document.getElementById('focus-' + id);
  if (focusSelect){
    focusSelect.innerHTML = '<option value="">-- choose a goal --</option>' +
      s.goals.map((g, idx) => {
        const when = g.isDaily ? ' (🔁 Daily)' : (g.date ? ` (${g.date}${g.startTime ? ' ' + g.startTime : ''})` : '');
        return `<option value="${idx}" ${s.focusIdx === idx ? 'selected' : ''}>[${GOAL_CATEGORIES[g.category]}] ${g.text ? g.text.slice(0,32) : '(unnamed)'}${when}</option>`;
      }).join('');
  }
}

function addRoutineRow(name = '', minutes = '', time = ''){
  routineTasks.push({ name, minutes, time });
  renderRoutineList();
}

function removeRoutineRow(idx){
  routineTasks.splice(idx, 1);
  renderRoutineList();
  calculateCapacity(true);
}

function moveRoutineTask(idx, dir){
  const j = idx + dir;
  if (j < 0 || j >= routineTasks.length) return;
  [routineTasks[idx], routineTasks[j]] = [routineTasks[j], routineTasks[idx]];
  renderRoutineList();
  calculateCapacity(true);
}

function renderRoutineList(){
  const list = document.getElementById('routineList');
  list.innerHTML = '';
  routineTasks.forEach((t, idx) => {
    if (!t) return;
    const row = document.createElement('div');
    row.className = 'routineRow';
    row.innerHTML = `
      <div class="reorder">
        <button onclick="moveRoutineTask(${idx}, -1)" title="Move up">▲</button>
        <button onclick="moveRoutineTask(${idx}, 1)" title="Move down">▼</button>
      </div>
      <input type="text" placeholder="e.g. Kaushik's time, cooking, commute" value="${t.name || ''}">
      <input type="number" placeholder="min" value="${t.minutes || ''}">
      <input type="time" title="Fixed clock time (optional)" value="${t.time || ''}">
      <button onclick="removeRoutineRow(${idx})">✕</button>
    `;
    const [txt, num, timeInput] = row.querySelectorAll('input');
    txt.addEventListener('change', e => { routineTasks[idx].name = e.target.value; calculateCapacity(true); });
    num.addEventListener('change', e => { routineTasks[idx].minutes = e.target.value; calculateCapacity(true); });
    timeInput.addEventListener('change', e => { routineTasks[idx].time = e.target.value; calculateCapacity(true); });
    list.appendChild(row);
  });
}

function movePriority(id, dir){
  const i = priorityOrder.indexOf(id);
  const j = i + dir;
  if (j < 0 || j >= priorityOrder.length) return;
  [priorityOrder[i], priorityOrder[j]] = [priorityOrder[j], priorityOrder[i]];
  saveCapacityState();
  calculateCapacity(true);
}

function timeToMinutes(t){
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function minutesToTime12(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  let h = Math.floor(mins / 60);
  const m = mins % 60;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

function updateKaushikSchedule(){
  const kWake = timeToMinutes(document.getElementById('kaushikWake').value);
  const note = document.getElementById('kaushikScheduleNote');
  if (kWake === null){
    note.style.display = 'none';
    saveCapacityState();
    return;
  }
  const kEnd = kWake + 60; // morning schedule duration
  note.style.display = 'block';
  note.textContent = `👶 Kaushik's morning schedule (based on wake-up): ${minutesToTime12(kWake)} - ${minutesToTime12(kEnd)}`;
  saveCapacityState();
}

function findTaskMinutes(patterns){
  const task = routineTasks.find(r => r && r.name && patterns.every(p => r.name.toLowerCase().includes(p)));
  return task ? Number(task.minutes || 0) : 0;
}

function findTaskTime(patterns){
  const task = routineTasks.find(r => r && r.name && patterns.every(p => r.name.toLowerCase().includes(p)));
  return task && task.time ? timeToMinutes(task.time) : null;
}

function renderMorningEveningSchedule(){
  const wakeM = timeToMinutes(document.getElementById('wakeTime').value);
  const kaushikWakeM = timeToMinutes(document.getElementById('kaushikWake').value);
  const dutyStartM = timeToMinutes(document.getElementById('dutyStart').value);
  const dutyEndM = timeToMinutes(document.getElementById('dutyEnd').value);
  const sleepM = timeToMinutes(document.getElementById('sleepTime').value);

  const travelTotal = findTaskMinutes(['travel']);
  const halfTravel = Math.round(travelTotal / 2);

  const morningRaw = [];
  const eveningRaw = [];
  const droppedKnown = [];

  const MORNING_PATTERNS = [['breathing'], ['yoga'], ['meditation'], ['kaushik','morning']];
  const EVENING_PATTERNS = [['homework'], ['dinner'], ['kaushik','evening']];
  const classify = (name) => {
    const lower = (name || '').toLowerCase();
    if (lower.includes('travel')) return 'travel';
    if (MORNING_PATTERNS.some(p => p.every(k => lower.includes(k)))) return 'morning';
    if (EVENING_PATTERNS.some(p => p.every(k => lower.includes(k)))) return 'evening';
    return null;
  };

  if (wakeM !== null) morningRaw.push({ label: 'Wake up', start: wakeM, end: wakeM, marker: true });
  if (dutyEndM !== null) eveningRaw.push({ label: 'Duty ends', start: dutyEndM, end: dutyEndM, marker: true });
  if (dutyEndM !== null && travelTotal > 0){
    eveningRaw.push({ label: 'Travel back', start: dutyEndM, end: dutyEndM + halfTravel });
  }

  // Walk routineTasks in the person's own chosen order (reorderable via the ▲▼ arrows).
  // A task's own fixed time always wins; tasks left without a time chain sequentially,
  // in this order, after the previous task in their half of the day.
  let morningCursor = wakeM;
  let eveningCursor = dutyEndM !== null ? dutyEndM + halfTravel : null;
  const kaushikMorningFallback = kaushikWakeM;

  routineTasks.forEach(t => {
    if (!t || !t.name) return;
    const cls = classify(t.name);
    if (cls !== 'morning' && cls !== 'evening') return;
    const mins = Number(t.minutes || 0);
    if (mins <= 0) return;
    const fixedM = t.time ? timeToMinutes(t.time) : null;

    if (cls === 'morning'){
      const isKaushikMorning = t.name.toLowerCase().includes('kaushik');
      const fallback = (fixedM === null && isKaushikMorning && morningCursor === null) ? kaushikMorningFallback : morningCursor;
      const start = fixedM !== null ? fixedM : fallback;
      if (start === null || start === undefined){ droppedKnown.push(t.name); return; }
      morningRaw.push({ label: t.name, start, end: start + mins });
      morningCursor = start + mins;
    } else {
      const start = fixedM !== null ? fixedM : eveningCursor;
      if (start === null || start === undefined){ droppedKnown.push(t.name); return; }
      eveningRaw.push({ label: t.name, start, end: start + mins });
      eveningCursor = start + mins;
    }
  });

  if (dutyStartM !== null && travelTotal > 0){
    morningRaw.push({ label: 'Travel to duty', start: dutyStartM - halfTravel, end: dutyStartM });
  }
  if (dutyStartM !== null) morningRaw.push({ label: 'Duty starts', start: dutyStartM, end: dutyStartM, marker: true });
  if (sleepM !== null) eveningRaw.push({ label: 'Sleep', start: sleepM, end: sleepM, marker: true });

  // Step 2: sort chronologically, then walk through inserting "Free time" wherever
  // there's a genuine gap between the end of one block and the start of the next.
  const finalizeSchedule = (raw) => {
    raw.sort((a, b) => a.start - b.start);
    const out = [];
    let cursor = null;
    raw.forEach(b => {
      if (cursor !== null && b.start > cursor){
        out.push({ label: 'Free time', start: cursor, end: b.start, free: true });
      }
      out.push(b);
      cursor = cursor === null ? b.end : Math.max(cursor, b.end);
    });
    return out;
  };

  const KNOWN_PATTERNS = [['travel'], ['kaushik','morning'], ['homework'], ['dinner'], ['kaushik','evening'], ['meditation'], ['yoga'], ['breathing']];
  const isKnownTask = (name) => {
    const lower = (name || '').toLowerCase();
    return KNOWN_PATTERNS.some(patterns => patterns.every(p => lower.includes(p)));
  };

  // Any other custom task the person added — if it has a fixed time, place it directly on the timeline.
  const unscheduledCustom = [];
  routineTasks.forEach(t => {
    if (!t || !t.name || isKnownTask(t.name)) return;
    const mins = Number(t.minutes || 0);
    if (mins <= 0) return;
    const fixedM = t.time ? timeToMinutes(t.time) : null;
    if (fixedM !== null){
      const block = { label: t.name, start: fixedM, end: fixedM + mins };
      if (fixedM < 720) morningRaw.push(block);
      else eveningRaw.push(block);
    } else {
      unscheduledCustom.push(t.name);
    }
  });

  const morningBlocks = finalizeSchedule(morningRaw);
  const eveningBlocks = finalizeSchedule(eveningRaw);
  const allUnscheduled = [...unscheduledCustom, ...droppedKnown];

  // Keep everything in chronological order regardless of insertion order
  morningBlocks.sort((a, b) => a.start - b.start);
  eveningBlocks.sort((a, b) => a.start - b.start);

  const renderCol = (elId, blocks, showUnscheduled) => {
    const el = document.getElementById(elId);
    if (!el) return;
    if (blocks.length === 0){
      el.innerHTML = '<div class="scheduleBlock"><span class="label">Fill in the times above</span></div>';
    } else {
      el.innerHTML = blocks.map(b => `
        <div class="scheduleBlock${b.free ? ' free' : ''}">
          <span class="label">${b.label}</span>
          <span class="time">${b.marker ? minutesToTime12(b.start) : `${minutesToTime12(b.start)} – ${minutesToTime12(b.end)}`}</span>
        </div>
      `).join('');
    }
    if (showUnscheduled && allUnscheduled.length){
      el.innerHTML += `<div class="scheduleBlock free"><span class="label">${allUnscheduled.join(', ')} — add a time above to place ${allUnscheduled.length > 1 ? 'these' : 'it'} here</span></div>`;
    }
  };

  renderCol('morningSchedule', morningBlocks, false);
  renderCol('eveningSchedule', eveningBlocks, true);
  document.getElementById('scheduleSplit').style.display = 'flex';
}

function calculateCapacity(silent){
  const dStart = timeToMinutes(document.getElementById('dutyStart').value);
  const dEnd = timeToMinutes(document.getElementById('dutyEnd').value);
  let dutyMinutes = 0;
  if (dStart !== null && dEnd !== null){
    dutyMinutes = dEnd > dStart ? (dEnd - dStart) : (1440 - dStart + dEnd);
  }
  const routineMinutes = routineTasks
    .filter(r => r && r.minutes)
    .reduce((sum, r) => sum + Number(r.minutes || 0), 0);

  const wakeM = timeToMinutes(document.getElementById('wakeTime').value);
  const sleepM = timeToMinutes(document.getElementById('sleepTime').value);
  let sleepBuffer = 420; // fallback ~7 hrs if wake/sleep not set
  if (wakeM !== null && sleepM !== null){
    sleepBuffer = wakeM > sleepM ? (1440 - sleepM + wakeM) : (wakeM - sleepM + 1440) % 1440;
    if (sleepBuffer === 0) sleepBuffer = 1440;
  }
  let leftover = 1440 - dutyMinutes - routineMinutes - sleepBuffer;
  if (leftover < 0) leftover = 0;

  assignedMinutes = {};
  let remaining = leftover;
  priorityOrder.forEach(id => {
    if (remaining >= CHUNK){
      assignedMinutes[id] = CHUNK;
      remaining -= CHUNK;
    } else if (remaining > 0){
      assignedMinutes[id] = remaining;
      remaining = 0;
    } else {
      assignedMinutes[id] = 0;
    }
  });

  const resultEl = document.getElementById('leftoverResult');
  const sleepHrs = Math.floor(sleepBuffer / 60);
  const sleepMins = sleepBuffer % 60;
  const hrs = Math.floor(leftover / 60);
  const mins = leftover % 60;
  const activeCount = Object.values(assignedMinutes).filter(m => m > 0).length;
  resultEl.style.display = 'block';
  resultEl.innerHTML = `Today's leftover time: <b>${hrs} hr ${mins} min</b> (after setting aside <b>${sleepHrs} hr ${sleepMins} min</b> for sleep). This means <b>${activeCount}</b> project${activeCount !== 1 ? 's' : ''} can be active today, by priority — the rest are parked for tomorrow.`;

  saveCapacityState();
  renderMorningEveningSchedule();
  render();
  if (!silent) {} 
}

async function saveCapacityState(){
  try{
    await storage.set('daycapacity', JSON.stringify({
      wakeTime: document.getElementById('wakeTime').value,
      sleepTime: document.getElementById('sleepTime').value,
      dutyStart: document.getElementById('dutyStart').value,
      dutyEnd: document.getElementById('dutyEnd').value,
      kaushikWake: document.getElementById('kaushikWake').value,
      routineTasks,
      priorityOrder,
      date: todayStr()
    }), false);
  }catch(e){ console.error(e); }
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

async function loadState(){
  for (const p of PROJECTS){
    try{
      const res = await storage.get('project:' + p.id, false);
      state[p.id] = res ? JSON.parse(res.value) : { step: '', lastDone: '', streak: 0, sugIdx: 0, goals: [], focusIdx: null };
      if (state[p.id].sugIdx === undefined) state[p.id].sugIdx = 0;
      if (state[p.id].goals === undefined) state[p.id].goals = [];
      if (state[p.id].focusIdx === undefined) state[p.id].focusIdx = null;
    }catch(e){
      state[p.id] = { step: '', lastDone: '', streak: 0, sugIdx: 0, goals: [], focusIdx: null };
    }
  }
  try{
    const dumpRes = await storage.get('braindump', false);
    if (dumpRes) document.getElementById('brainDump').value = dumpRes.value;
  }catch(e){}

  for (const p of PROJECTS){
    const s = state[p.id];
    const pool = SUGGESTIONS[p.id] || [];
    if (!s.step && pool.length){
      s.step = pool[s.sugIdx % pool.length];
      s.sugIdx = (s.sugIdx + 1) % pool.length;
      saveProject(p.id);
    }
  }

  let loadedFromToday = false;
  try{
    const capRes = await storage.get('daycapacity', false);
    if (capRes){
      const cap = JSON.parse(capRes.value);
      if (cap.date === todayStr()){
        document.getElementById('wakeTime').value = cap.wakeTime || '';
        document.getElementById('sleepTime').value = cap.sleepTime || '';
        document.getElementById('dutyStart').value = cap.dutyStart || '';
        document.getElementById('dutyEnd').value = cap.dutyEnd || '';
        document.getElementById('kaushikWake').value = cap.kaushikWake || '';
        (cap.routineTasks || []).forEach(r => { if (r) addRoutineRow(r.name, r.minutes, r.time); });
        if (cap.priorityOrder) priorityOrder = cap.priorityOrder;
        loadedFromToday = true;
      }
    }
  }catch(e){}

  if (!loadedFromToday){
    let template = DEFAULT_ROUTINE;
    try{
      const defRes = await storage.get('defaultRoutine', false);
      if (defRes) template = JSON.parse(defRes.value);
    }catch(e){}
    document.getElementById('wakeTime').value = template.wakeTime || '';
    document.getElementById('sleepTime').value = template.sleepTime || '';
    document.getElementById('dutyStart').value = template.dutyStart || '';
    document.getElementById('dutyEnd').value = template.dutyEnd || '';
    document.getElementById('kaushikWake').value = template.kaushikWake || '';
    (template.routineTasks || []).forEach(r => { if (r) addRoutineRow(r.name, r.minutes, r.time); });
    if (template.priorityOrder) priorityOrder = template.priorityOrder;
  }

  // Migration safety: drop any stale ids no longer in PROJECTS (e.g. old 'book'), and add any new ones
  const validIds = PROJECTS.map(p => p.id);
  priorityOrder = priorityOrder.filter(id => validIds.includes(id));
  validIds.forEach(id => { if (!priorityOrder.includes(id)) priorityOrder.push(id); });

  updateKaushikSchedule();
  render();
  calculateCapacity(true);
}

const DUMP_KEYWORDS = {
  sssn: ['sssn', 'cat', 'cats', 'caretaker', 'boarding', 'rescue', 'vet', 'ngo', 'stray'],
  art: ['art', 'painting', 'paint', 'swami', 'canvas', 'draw', 'sketch', 'brush'],
  railway: ['railway', 'irpsm', 'sanction', 'projectid', 'executive', 'plan head', 'duty', 'narrative', 'gm narrative', 'annual report'],
  kaushik: ['kaushik', 'school', 'wonder kids', 'aadhaar', 'baal', 'homework'],
  health: ['health', 'glucose', 'sugar', 'yoga', 'meditation', 'doctor', 'physio', 'cataract', 'breathing', 'exercise'],
  mba: ['mba', 'study', 'exam', 'assignment', 'course', 'lecture', 'chapter', 'notes']
};

const MONTH_NAMES = ['january','february','march','april','may','june','july','august','september','october','november','december'];

function fmtDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseDateFromText(text){
  const lower = text.toLowerCase();
  const today = new Date();
  today.setHours(0,0,0,0);

  // "tomorrow" / "kal"
  if (/\btomorrow\b|\bkal\b/.test(lower)){
    const d = new Date(today);
    d.setDate(d.getDate() + 1);
    return fmtDate(d);
  }

  // "next week"
  if (/\bnext week\b/.test(lower)){
    const d = new Date(today);
    d.setDate(d.getDate() + 7);
    return fmtDate(d);
  }

  // "next month"
  if (/\bnext month\b/.test(lower)){
    const d = new Date(today);
    d.setMonth(d.getMonth() + 1);
    return fmtDate(d);
  }

  // "next year"
  if (/\bnext year\b/.test(lower)){
    const d = new Date(today);
    d.setFullYear(d.getFullYear() + 1);
    return fmtDate(d);
  }

  // day + month name, e.g. "15 august" or "august 15"
  let m = lower.match(/\b(\d{1,2})(st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december)\b/);
  if (!m) m = lower.match(/\b(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})(st|nd|rd|th)?\b/);
  if (m){
    let day, monthName;
    if (MONTH_NAMES.includes(m[1])){ monthName = m[1]; day = parseInt(m[2], 10); }
    else { day = parseInt(m[1], 10); monthName = m[3]; }
    const monthIdx = MONTH_NAMES.indexOf(monthName);
    let year = today.getFullYear();
    let candidate = new Date(year, monthIdx, day);
    if (candidate < today) candidate = new Date(year + 1, monthIdx, day);
    return fmtDate(candidate);
  }

  // "next <month name>" (no day given — defaults to the 1st)
  m = lower.match(/\bnext\s+(january|february|march|april|may|june|july|august|september|october|november|december)\b/);
  if (m){
    const monthIdx = MONTH_NAMES.indexOf(m[1]);
    let year = today.getFullYear();
    if (monthIdx <= today.getMonth()) year += 1;
    return fmtDate(new Date(year, monthIdx, 1));
  }

  // bare month name, e.g. "in July" — nearest upcoming occurrence
  m = lower.match(/\b(january|february|march|april|may|june|july|august|september|october|november|december)\b/);
  if (m){
    const monthIdx = MONTH_NAMES.indexOf(m[1]);
    let year = today.getFullYear();
    if (monthIdx < today.getMonth()) year += 1;
    return fmtDate(new Date(year, monthIdx, 1));
  }

  return null;
}

function categorizeLocally(text){
  const lines = text.split(/\n+|(?<=[.!?])\s+(?=[A-Z])/).map(s => s.trim()).filter(Boolean);
  const sorted = [];
  const unsorted = [];
  lines.forEach(line => {
    const lower = line.toLowerCase();
    let matchedProject = null;
    for (const p of PROJECTS){
      const kws = DUMP_KEYWORDS[p.id] || [];
      if (kws.some(k => lower.includes(k))){ matchedProject = p.id; break; }
    }
    if (matchedProject){
      let category = 'current';
      if (/urgent|abhi|turant|asap|emergency|jaldi/.test(lower)) category = 'urgent';
      else if (/future|kabhi|baad mein|someday|eventually|long term/.test(lower)) category = 'future';
      const parsedDate = parseDateFromText(line);
      if (parsedDate && category === 'current') category = 'future';
      sorted.push({ project: matchedProject, text: line.slice(0, 80), category, date: parsedDate || '' });
    } else {
      unsorted.push(line);
    }
  });
  return { sorted, unsorted };
}

async function saveDump(){
  const val = document.getElementById('brainDump').value;
  const statusEl = document.getElementById('dumpStatus');
  if (!val.trim()){
    statusEl.textContent = 'Nothing to park';
    setTimeout(()=> statusEl.textContent = '', 2000);
    return;
  }

  statusEl.textContent = 'Sorting...';

  let items = null;

  // Try AI sorting first (only works when running inside Claude.ai). If unavailable, fall back to local keyword sorting below.
  try{
    const projList = PROJECTS.map(p => `${p.id} (${p.name})`).join(', ');
    const prompt = `Sort this raw stream-of-consciousness note into project categories. Available projects: ${projList}. Note: """${val}"""

For each distinct actionable thought or goal in the note, output one object with fields: "project" (the closest matching project id from the list above), "text" (a short rewritten version of the thought, under 12 words), "category" (one of "current", "urgent", "future" based on tone/urgency). Return ONLY a raw JSON array, no markdown fences, no explanation, no extra text. If there is nothing actionable, return [].`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    let raw = textBlock ? textBlock.text.trim() : null;
    if (raw){
      raw = raw.replace(/^```json|```$/g, '').trim();
      items = JSON.parse(raw);
    }
  }catch(e){
    items = null;
  }

  const validIds = PROJECTS.map(p => p.id);
  const sortedInto = {};
  let leftoverText = '';

  if (Array.isArray(items) && items.length > 0){
    items.forEach(item => {
      if (!item || !validIds.includes(item.project) || !item.text) return;
      const s = state[item.project];
      const cat = ['current','urgent','future'].includes(item.category) ? item.category : 'current';
      const parsedDate = parseDateFromText(item.text);
      s.goals.push({ text: item.text, category: cat, date: parsedDate || '' });
      if (s.focusIdx === null) s.focusIdx = s.goals.length - 1;
      saveProject(item.project);
      sortedInto[item.project] = (sortedInto[item.project] || 0) + 1;
    });
  } else {
    // Local fallback — works everywhere, no AI needed
    const { sorted, unsorted } = categorizeLocally(val);
    sorted.forEach(item => {
      const s = state[item.project];
      s.goals.push({ text: item.text, category: item.category, date: item.date || '' });
      if (s.focusIdx === null) s.focusIdx = s.goals.length - 1;
      saveProject(item.project);
      sortedInto[item.project] = (sortedInto[item.project] || 0) + 1;
    });
    leftoverText = unsorted.join('\n');
  }

  document.getElementById('brainDump').value = leftoverText;
  await storage.set('braindump', leftoverText, false);

  if (Object.keys(sortedInto).length){
    const names = Object.keys(sortedInto).map(id => (PROJECTS.find(p => p.id === id) || {}).name || id);
    statusEl.textContent = leftoverText
      ? `Sorted into: ${names.join(', ')} — rest kept here (no project match)`
      : `Parked ✓ Sorted into: ${names.join(', ')}`;
    render();
  } else {
    statusEl.textContent = 'Parked ✓ (no project match found — kept here)';
  }
  setTimeout(()=> statusEl.textContent = '', 5000);
}

async function suggestNext(id){
  const s = state[id];
  const btn = document.getElementById('sug-' + id);
  const pool = SUGGESTIONS[id] || [];
  const quota = assignedMinutes[id];
  const focusGoal = (s.focusIdx !== null && s.goals[s.focusIdx]) ? s.goals[s.focusIdx] : null;

  if (focusGoal && focusGoal.text && focusGoal.text.trim().length > 0){
    btn.classList.add('loading');
    btn.textContent = '...thinking';
    try{
      const projName = (PROJECTS.find(p => p.id === id) || {}).name || id;
      const timeNote = (quota !== undefined) ? `There's only about ${quota} minutes available for this today.` : 'Time is limited today, pick something small.';
      const catNote = focusGoal.category === 'future'
        ? 'This is a BIG, LONG-TERM goal — today just needs one small, starting step toward it, not the whole goal.'
        : focusGoal.category === 'urgent'
          ? 'This is an URGENT task — it needs a small, concrete, high-priority step today.'
          : 'This is an ongoing task already in progress — it needs the next small step forward.';
      const kaushikNote = id === 'kaushik'
        ? ' This is for a 2.5-year-old (Kaushik). His fixed daily slots with him are: morning schedule 8:30-9:30am, play/learning time 7-8pm, and evening bonding time 9-10:30pm. Wherever it fits naturally, suggest something that can happen inside one of these existing slots rather than needing extra separate time.'
        : '';
      const prompt = `You are a supportive planning assistant. Project: "${projName}". Goal: "${focusGoal.text}". ${catNote}${kaushikNote} ${timeNote} Suggest ONLY ONE small, concrete, achievable step for today toward this goal — in plain English, under 12 words, no explanation, just that one action line.`;
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      const suggestion = textBlock ? textBlock.text.trim().replace(/^["']|["']$/g, '') : null;
      if (suggestion){
        s.step = suggestion;
      } else {
        s.step = pool[s.sugIdx % pool.length] || s.step;
        s.sugIdx = (s.sugIdx + 1) % pool.length;
      }
    }catch(e){
      s.step = pool[s.sugIdx % pool.length] || s.step;
      s.sugIdx = (s.sugIdx + 1) % pool.length;
    }
    saveProject(id);
    render();
  } else {
    if (pool.length === 0) return;
    s.step = pool[s.sugIdx % pool.length];
    s.sugIdx = (s.sugIdx + 1) % pool.length;
    saveProject(id);
    render();
  }
}

function buildHealthSchedule(){
  const blocks = [];

  // Fixed daily practice — already accounted for in your routine time, not dependent on leftover quota
  blocks.push('10 min — Breathing exercise');
  blocks.push('30 min — Yoga (physio-cleared moves only)');
  blocks.push('20 min — Meditation');

  // Flexible extras — only if there's leftover project quota today
  const quota = assignedMinutes['health'] || 0;
  if (quota > 0){
    let remaining = quota;
    const push = (label, mins) => {
      if (remaining > 0){
        const m = Math.min(mins, remaining);
        blocks.push(`${m} min — ${label}`);
        remaining -= m;
      }
    };
    push('Log glucose reading (Contour Plus)', 3);
    push('Supplement check-in (Gutfit / Multivitamin / Protein, per your timing)', 5);
    push('Quick check: sun protection if stepping out, IBS-friendly bite if needed', 5);
  } else {
    blocks.push('(No extra project slot today for glucose log/supplements — just the fixed practice above.)');
  }

  state.health.step = blocks.join('\n');
  saveProject('health');
  render();
}

function renderDailyProgress(){
  const t = todayStr();
  let completed = 0, postponed = 0, cancelled = 0, pending = 0;
  PROJECTS.forEach(p => {
    const s = state[p.id];
    if (!s || !s.goals) return;
    s.goals.forEach(g => {
      const inScopeToday = g.isDaily || g.date === t;
      if (!inScopeToday) return;
      const status = g.isDaily ? ((g.statusByDate && g.statusByDate[t]) || 'pending') : (g.status || 'pending');
      if (status === 'completed') completed++;
      else if (status === 'postponed') postponed++;
      else if (status === 'cancelled') cancelled++;
      else pending++;
    });
  });

  const total = completed + postponed + cancelled + pending;
  const bar = document.getElementById('progressBar');
  const legend = document.getElementById('progressLegend');
  if (!bar || !legend) return;

  if (total === 0){
    bar.innerHTML = `<div class="seg" style="width:100%;background:#EFEBE0;"></div>`;
    legend.innerHTML = `<span>No tasks scheduled for today yet</span>`;
    return;
  }

  const pct = n => (n / total * 100).toFixed(1);
  bar.innerHTML = `
    <div class="seg" style="width:${pct(completed)}%;background:#97C459;"></div>
    <div class="seg" style="width:${pct(postponed)}%;background:#FAC775;"></div>
    <div class="seg" style="width:${pct(cancelled)}%;background:#F09595;"></div>
    <div class="seg" style="width:${pct(pending)}%;background:#D3D1C7;"></div>
  `;
  legend.innerHTML = `
    <span><span class="dot" style="background:#639922;"></span>Done: ${completed}</span>
    <span><span class="dot" style="background:#EF9F27;"></span>Postponed: ${postponed}</span>
    <span><span class="dot" style="background:#E24B4A;"></span>Cancelled: ${cancelled}</span>
    <span><span class="dot" style="background:#888780;"></span>Pending: ${pending}</span>
  `;
}

function importData(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const dump = JSON.parse(e.target.result);
      for (const p of PROJECTS){
        if (dump['project:' + p.id]){
          state[p.id] = dump['project:' + p.id];
          await storage.set('project:' + p.id, JSON.stringify(state[p.id]), false);
        }
      }
      if (dump.braindump !== undefined){
        document.getElementById('brainDump').value = dump.braindump;
        await storage.set('braindump', dump.braindump, false);
      }
      if (dump.daycapacity){
        const cap = dump.daycapacity;
        document.getElementById('wakeTime').value = cap.wakeTime || '';
        document.getElementById('sleepTime').value = cap.sleepTime || '';
        document.getElementById('dutyStart').value = cap.dutyStart || '';
        document.getElementById('dutyEnd').value = cap.dutyEnd || '';
        document.getElementById('kaushikWake').value = cap.kaushikWake || '';
        document.getElementById('routineList').innerHTML = '';
        routineTasks = [];
        (cap.routineTasks || []).forEach(r => { if (r) addRoutineRow(r.name, r.minutes, r.time); });
        if (cap.priorityOrder) priorityOrder = cap.priorityOrder;
        await saveCapacityState();
        updateKaushikSchedule();
      }
      render();
      calculateCapacity(true);
      alert('Backup restored successfully.');
    }catch(err){
      alert('Could not read this backup file. Please make sure it is a valid export from this app.');
    }
  };
  reader.readAsText(file);
}

      btn.textContent = '🔔 Enable reminders';
      alert('Notifications were not allowed. You can enable them from your browser site settings.');
    }
  });
}

function checkReminders(){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const todayD = todayStr();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  PROJECTS.forEach(p => {
    const s = state[p.id];
    if (!s || !s.goals) return;
    s.goals.forEach((g, idx) => {
      if (!g.startTime) return;
      const inScopeToday = g.isDaily || g.date === todayD;
      if (!inScopeToday) return;
      const status = g.isDaily ? ((g.statusByDate && g.statusByDate[todayD]) || 'pending') : (g.status || 'pending');
      if (status !== 'pending') return;

      const goalMinutes = timeToMinutes(g.startTime);
      if (goalMinutes === null) return;

      // Fire when current time reaches the scheduled minute (within a 2-min window so we don't miss it between checks)
      if (nowMinutes >= goalMinutes && nowMinutes <= goalMinutes + 2){
        const key = `${p.id}:${idx}:${todayD}:${g.startTime}`;
        if (remindedKeys.has(key)) return;
        remindedKeys.add(key);
        try{
          new Notification(`${p.name}: ${g.text || 'Scheduled task'}`, {
            body: `Scheduled for ${g.startTime}${g.endTime ? ' - ' + g.endTime : ''}`,
            tag: key
          });
        }catch(e){}
      }
    });
  });
}

setInterval(checkReminders, 30000);

if ('Notification' in window && Notification.permission === 'granted'){
  const btn = document.getElementById('reminderBtn');
  if (btn){
    btn.textContent = '🔔 Reminders ON';
    btn.style.background = '#EAF3DE';
    btn.style.borderColor = '#639922';
    btn.style.color = '#3B6D11';
  }
}

loadState();
checkStorageHealth();
</script>
